[tool.poetry]
name = "simulation-bridge"
version = "0.1.0"
description = "Simulation Bridge"
authors = ["Marco Melloni <291358@studenti.unimore.it>"]
license = "ICAPL"
readme = "README.md"

packages = [{ include = "simulation_bridge" }]

include = [
    "simulation_bridge/resources/**/*",
    "simulation_bridge/config/**/*"
]

[tool.poetry.dependencies]
blinker = "^1.9.0"
colorlog = "^6.9.0"
fastapi = "^0.115.12"
hypercorn = "^0.17"
httpx = "^0.28.1"
paho-mqtt = ">=2.1.0,<3.0.0"
pika = "^1.3.2"
pydantic = "^2.11.5"
pyyaml = ">=6.0.2,<7.0.0"
pylint = "^3.3.7"
quart = "^0.20.0"
requests = "^2.32.3"
python = "^3.12"
uvicorn = "^0.34.2"
cryptography = "^45.0.4"
psutil = "^7.0.0"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.3.2"
black = "^25.1.0"
flake8 = "^7.2.0"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^8.3.5"
pytest-asyncio = "^1.0.0"
types-pyyaml = "^6.0.12.20250402"
pytest-cov = "^6.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
simulation-bridge = "simulation_bridge.src.main:main"