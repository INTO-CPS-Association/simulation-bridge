[tool.poetry]
name = "base-agent"
version = "0.1.0"
description = "Shared code for simulator agents in simulation-bridge"
authors = ["INTO-CPS Association"]
readme = "README.md"
packages = [{ include = "base_agent" }]
license = "ICAPL"

[tool.poetry.dependencies]
python = "^3.10"
pika = "^1.3.2"
pyyaml = ">=6.0.2,<7.0.0"
colorlog = "^6.10.1"
pydantic = "^2.11.4"
psutil = "^6.0.0"

[tool.poetry.group.dev.dependencies]
autopep8 = "^2.3.2"
pylint = "^3.3.7"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
